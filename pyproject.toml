[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sc-big-caller"
version = "0.2.0"
description = "Bayesian model for somatic SNV re-detection in single-cell DNA sequencing using bulk sequencing data"
authors = [
    {name="Daniel Schütte", email="daniel.schuette@iccb-cologne.org"}
]
maintainers = [
    {name="Daniel Schütte", email="daniel.schuette@iccb-cologne.org"},
    {name="Thomas Kono", email="thomas.kono@iccb-cologne.org"},
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "pyro-ppl>=1.8.0",
    "pysam>=0.22.0",
]
license = "GPL-3.0"
license-files = ["LICENSE.md"]

[project.urls]
Homepage = "https://github.com/ICCB-Cologne/sc-big"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest_xdist>=3.8.0",
    "flake8>=6.0.0",
]

[project.scripts]
sc-big = "scripts.snv_caller:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]
